[project]
name = "image-metadata"
version = "0.1.0"
description = "Inspect image metadata and optionally remove it without re-encoding images"
authors = [
    { name = "mcgillij", email = "mcgillivray.jason@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1,<9",
    "piexif>=1.1.3,<2",
    "pillow>=12.1,<13",
    "rich>=14,<15",
]
keywords = ["exif", "image", "metadata", "privacy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Multimedia :: Graphics",
]

[project.scripts]
image-metadata = "image_metadata.cli:cli"

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "image_metadata", from = "src" }]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
